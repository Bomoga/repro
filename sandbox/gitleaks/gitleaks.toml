# Repro's gitleaks config. Passed explicitly with --config so a target repo's own .gitleaks.toml
# (untrusted, section 9) can't allowlist its way out of detection.
title = "repro"

[extend]
useDefault = true

# Installed dependencies and Repro's own scratch space (packages/executor/src/install.ts) aren't the
# project's code: a key inside some package in node_modules/ is that package's business.
[[allowlists]]
description = "Installed dependencies and Repro's scratch space"
paths = ['''(^|/)node_modules/''', '''(^|/)\.repro/''']
